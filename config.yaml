# ============================================================================
#  LES PERSONNES PROPOSÉES PAR DÉFAUT
#  Sur la page, chaque visiteur part de cette liste et peut la modifier, en
#  ajouter ou en supprimer (enregistré dans son navigateur, sans compte).
#  Elles servent aussi au bot pour choisir les deals « À ne pas rater ».
#  - interets : ids de la liste ci-dessus
#  - mots_cles : idées en plus (facultatif) ; exclure : mots à écarter
#  - budget_max / budget_min en euros
# ============================================================================
profils:
  - nom: Maman
    emoji: "👩"
    budget_max: 150
    interets: [parfum_femme, soins, cheveux, sacs_bijoux, cuisine, maison_deco, experiences]
    exclure: [homme, enfant, bebe]

  - nom: Papa
    emoji: "👨"
    budget_max: 150
    interets: [parfum_homme, rasage, montres, mode_homme, bricolage, gourmand, tech_audio]
    exclure: [femme, enfant, bebe]

  - nom: Sœurs
    emoji: "👯‍♀️"
    budget_max: 120
    interets: [maquillage, soins, parfum_femme, cheveux, mode_femme, sacs_bijoux, sneakers, avent]
    exclure: [homme, enfant, bebe]

  - nom: Frère
    emoji: "🧢"
    budget_max: 150
    interets: [gaming, sneakers, mode_homme, tech_audio, sport, parfum_homme, rasage]
    exclure: [femme, fille, bebe]

  - nom: Copain / Copine
    emoji: "❤️"
    budget_max: 200
    interets: [parfum_femme, parfum_homme, sacs_bijoux, sneakers, tech_audio, experiences, gaming]
    exclure: [enfant, bebe]

  - nom: Maison & déco
    emoji: "🛋️"
    budget_max: 800
    interets: [maison_deco, cuisine]
    exclure: [ampoule, voiture]

  # Les deals « monstres » (très votés) dans les catégories cadeaux
  - nom: Coup de cœur
    emoji: "⭐"
    budget_max: 300
    interets: [coup_de_coeur]
    seuils:
      temperature_min: 600
      reduction_min: 50
      temperature_plancher: 200
    groupes: [parfums, maquillage, beaute, bijoux, montres, cadeaux, lego, jeux-de-societe, jouets]
    tous: true      # pas de filtre de centres d'intérêt, seulement les catégories ci-dessus

# ============================================================================
#  SOURCE 1 : Dealabs (communauté, couvre Sephora, Nocibé, Zalando, Fnac…)
#  « groupes » = catégories Dealabs (l'adresse https://www.dealabs.com/groupe/<nom>)
# ============================================================================
dealabs:
  actif: true
  page_hot: true                     # page des deals les plus chauds du moment
  pages_groupe_toutes_les_heures: 3  # pages « top du mois » de chaque catégorie
  suivi_nouveautes_heures: 48        # durée de suivi de la température d'un nouveau deal
  max_pages_deal_par_passage: 60
  # MARQUES SUIVIES : enseignes qui bloquent les robots. Tous leurs bons plans Dealabs
  # sont gardés, même peu votés (flux de nouveautés + page marchand Dealabs).
  # page = adresse https://www.dealabs.com/codes-promo/<page> (facultatif)
  marques_toutes_les_heures: 3
  marques_suivies:
    - {marque: Uniqlo, page: uniqlo, interets: [mode_femme, mode_homme], prioritaire: true}   # relue à chaque passage
    - {marque: Sephora, page: sephora, interets: [maquillage, soins, parfum_femme, parfum_homme]}
    - {marque: Nocibé, page: nocibe, interets: [maquillage, soins, parfum_femme, parfum_homme]}
    - {marque: Marionnaud, page: marionnaud, interets: [maquillage, soins, parfum_femme, parfum_homme]}
    - {marque: Yves Rocher, page: yves-rocher, interets: [soins, parfum_femme]}
    - {marque: Zalando, page: zalando, interets: [mode_femme, mode_homme, sneakers]}
    - {marque: Zara, page: zara, interets: [mode_femme, mode_homme]}
    - {marque: H&M, page: hm, interets: [mode_femme, mode_homme]}
    - {marque: Mango, page: mango, interets: [mode_femme]}
    - {marque: Sézane, interets: [mode_femme]}
    - {marque: Kiabi, page: kiabi, interets: [mode_femme, mode_homme]}
    - {marque: Jules, page: jules, interets: [mode_homme]}
    - {marque: Celio, page: celio, interets: [mode_homme]}
    - {marque: Levi's, page: levis, interets: [mode_homme, mode_femme]}
    - {marque: Lacoste, page: lacoste, interets: [mode_homme]}
    - {marque: The North Face, page: the-north-face, interets: [mode_homme, sport]}
    - {marque: Adidas, page: adidas, interets: [sneakers]}
    - {marque: Pandora, page: pandora, interets: [sacs_bijoux]}
    - {marque: Swarovski, page: swarovski, interets: [sacs_bijoux]}
    - {marque: Kave Home, interets: [maison_deco]}
    - {marque: Maisons du Monde, interets: [maison_deco]}
    - {marque: AM.PM, interets: [maison_deco]}
    - {marque: La Redoute, interets: [maison_deco, mode_femme]}
    - {marque: Lego, page: lego, interets: [jouets]}
    - {marque: Decathlon, page: decathlon, interets: [sport]}
  groupes:
    # Mode
    - mode-accessoires
    - chaussures
    - sneakers
    - manteaux
    - lingerie
    - bijoux
    - montres
    - bagagerie
    # Beauté
    - beaute
    - parfums
    - maquillage
    - sante-et-cosmetiques
    # Cadeaux, loisirs, tech
    - cadeaux
    - high-tech
    - jeux-video
    - lego
    - jouets
    - jeux-de-societe
    - electromenager
    - maison-habitat
    - champagne

# ============================================================================
#  SOURCE 2 : LeDénicheur (comparateur : Sephora, Nocibé, Marionnaud, Zalando,
#  Fnac, Darty, Amazon… sur une même fiche, avec 3 mois d'historique de prix)
#  « categories » = l'adresse https://ledenicheur.fr/c/<nom>
# ============================================================================
ledenicheur:
  actif: true
  toutes_les_heures: 3               # fréquence de parcours des catégories
  reduction_min: 20                 # -20 % sous le prix habituel des 3 derniers mois (vrai historique, pas un prix barré)
  historique_par_passage: 30        # fiches produit lues par passage pour connaître le prix habituel (3 mois)
  historique_valable_jours: 5       # relecture de l'historique d'un produit tous les 5 jours
  baisse_pour_verifier: 12          # baisse (%) qui fait relire l'historique en priorité
  categories:
    # Beauté
    - parfum
    - coffrets-cadeaux
    - palette-de-fards-a-paupiere
    - rouges-a-levres
    - fonds-de-teint
    - serums-visage
    - cremes-visage
    - lisseurs-boucleurs
    - coiffure
    - epilateurs-a-lumiere-pulsee
    - rasoir-electrique
    - tondeuses-cheveux
    - brosses-a-dents-electriques
    # Mode
    - sneakers-baskets
    - sacs-a-main-sacs-en-bandouliere
    - bottines-et-boots
    - vestes
    - montre
    - lunettes-de-soleil
    - valises
    # Tech & loisirs
    - montres-connectees
    - casque-audio
    - enceinte-portable
    - lecteurs-de-livres-numeriques
    - tablette-tactile
    - consoles-jeux
    - jeux-ps5
    - jeux-nintendo-switch-2
    - jeux-de-societe
    - tourne-disques
    # Maison
    - machines-a-expresso
    - airfryer-friteuses-traditionnelle
    - calendriers-de-lavent
    - canapes

# ============================================================================
#  SOURCE 3 : pages soldes des marchands, lues directement
#  (Nike met ses produits soldés directement dans sa page ; la plupart des autres
#   sites chargent leurs prix après coup ou bloquent les robots : ils passent par
#   Dealabs et LeDénicheur)
# ============================================================================
marchands:
  max_par_marchand: 12              # les N plus grosses réductions de chaque marque (évite qu'une marque inonde la page)
  prix_min: 20                      # ignore les petits accessoires (patchs, échantillons…)
  nike:
    actif: true
    toutes_les_heures: 2
    reduction_min: 30               # niveau habituel des soldes Nike ; les 12 plus grosses réductions sont gardées
    pages:                          # https://www.nike.com/fr/w/<page>
      - promotions-3yaep
      - hommes-promotions-3yaepznik1
      - femmes-promotions-3yaepz5e1x6
      - promotions-chaussures-3yaepzy7ok

  # Boutiques Shopify : leur catalogue public indique le prix barré de chaque article
  shopify:
    actif: true
    toutes_les_heures: 3
    reduction_min: 30
    pages_max: 4                    # 250 produits par page
    boutiques:
      # Mode femme
      - {nom: Rouje, url: "https://www.rouje.com"}
      - {nom: Make My Lemonade, url: "https://www.makemylemonade.com"}
      - {nom: Balzac Paris, url: "https://www.balzac-paris.fr"}
      - {nom: Musier Paris, url: "https://www.musier-paris.com"}
      - {nom: Polène, url: "https://www.polene-paris.com"}
      - {nom: Cabaïa, url: "https://cabaia.com"}
      - {nom: Pimkie, url: "https://www.pimkie.fr"}
      - {nom: Kookaï, url: "https://www.kookai.fr"}
      # Beauté
      - {nom: Oh My Cream, url: "https://www.ohmycream.com"}
      - {nom: Respire, url: "https://respire.co"}
      - {nom: Gisou, url: "https://www.gisou.com"}
      # Homme
      - {nom: Bonne Gueule, url: "https://bonnegueule.fr"}
      - {nom: Hast, url: "https://hast.fr"}
      # Maison
      - {nom: Ferm Living, url: "https://www.fermliving.fr"}
      - {nom: Maison Labiche, url: "https://maisonlabiche.com"}
      - {nom: Caravane, url: "https://www.caravane.fr"}
      - {nom: House Doctor, url: "https://www.housedoctor.com"}

  # (ajoutés : catalogue entier surveillé, utile pour le Black Friday)
  # Pages promo décrites en schema.org (prix + prix barré dans la page)
  pages_promo:
    actif: true
    toutes_les_heures: 3
    reduction_min: 25
    pages:
      # Sklum : Black November, « Special Price » et catégories (les 50 premiers produits de chaque page)
      - {nom: Sklum, url: "https://www.sklum.com/fr/26463-acheter-black-november", max: 20}
      - {nom: Sklum, url: "https://www.sklum.com/fr/11716-acheter-special-price", max: 20}
      - {nom: Sklum, url: "https://www.sklum.com/fr/11722-acheter-special-price-chaises", max: 20}
      - {nom: Sklum, url: "https://www.sklum.com/fr/11732-acheter-special-price-accessoires", max: 20}
      - {nom: Sklum, url: "https://www.sklum.com/fr/617-acheter-tabouret", max: 20}
      - {nom: Sklum, url: "https://www.sklum.com/fr/589-acheter-meubles-salle-a-manger", max: 20}
      - {nom: Sklum, url: "https://www.sklum.com/fr/543-acheter-chaises", max: 20}
      - {nom: Sklum, url: "https://www.sklum.com/fr/4767-acheter-meuble-bois", max: 20}
