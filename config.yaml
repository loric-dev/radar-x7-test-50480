# ============================================================================
#  Bot deals Noël / Black Friday : configuration
#  Tu peux modifier ce fichier librement (mots-clés, budgets, seuils…).
# ============================================================================

# --- Ce qu'on appelle un « gros deal » (valeurs par défaut, chaque profil peut les changer)
seuils:
  temperature_min: 150        # Dealabs : deal très voté par la communauté (100° = déjà bien, 500° = énorme)
  reduction_min: 30           # ou au moins -30 % vs le prix habituel…
  temperature_plancher: 30    # …à condition qu'au moins quelques personnes l'aient validé (évite les fausses promos)
  age_max_jours: 14           # ignore les deals publiés il y a plus de 14 jours

max_alertes_par_passage: 15   # au-delà, les deals suivants arrivent en un seul message récapitulatif
premier_lancement_max: 8      # au tout premier lancement, seulement les 8 meilleurs (pas de spam)
delai_entre_requetes: 2       # secondes entre deux pages d'un même site (politesse)

# Mots qui excluent un deal quel que soit le profil
exclure_partout:
  - lessive
  - adoucissant
  - papier toilette
  - couche
  - croquette
  - litiere
  - pneu
  - huile moteur
  - carburant
  - assurance
  - forfait
  - abonnement
  - echantillon
  - carte sim
  - reconditionne      # retire cette ligne si le reconditionné te va

# ============================================================================
#  CENTRES D'INTÉRÊT : des étiquettes posées sur chaque deal.
#  Sur la page, chacun crée ses personnes en cochant ces centres d'intérêt
#  (aucun compte nécessaire). Un deal reçoit une étiquette si l'un de ses
#  mots_cles est présent, s'il vient d'un des groupes (catégories Dealabs ou
#  « ldn:<catégorie LeDénicheur> »), ou d'un des marchands.
#  « palette + fards » = les 2 mots présents. Accents, majuscules, pluriels ignorés.
# ============================================================================
centres_interet:
