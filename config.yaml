# ============================================================================
#  SOURCE 3 bis : CATALOGUES COMPLETS
#  Le bot lit le plan du site (sitemap) de chaque enseigne et parcourt toutes
#  ses fiches produit, à tour de rôle (par_passage fiches à chaque passage,
#  tous les sites en même temps). Il repère :
#   - les prix barrés indiqués dans la fiche (ex. Sklum) ;
#   - les baisses par rapport aux prix qu'il a lui-même relevés.
#  Pour ajouter un site : son plan du site est indiqué dans <site>/robots.txt
#  (ligne « Sitemap: »).
# ============================================================================
catalogues:
  actif: true
  par_passage: 60                   # fiches lues par site et par passage (1 toutes les 2 s)
  reduction_min: 25                 # prix barré : -25 % minimum
  baisse_historique: 20             # sinon : -20 % sous le prix relevé par le bot
  max_par_site: 40                  # au plus 40 promos affichées par site
  paralleles: 24                    # sites lus en même temps (sites différents : reste poli pour chacun)
  sites:
    # Maison & meubles
    - {nom: Sklum, sitemap: "https://www.sklum.com/fr/img/core/skl/feed/sitemaps/index_sitemap_skl_fr.xml",
       filtre: "/fr/acheter-[a-z0-9-]+/[0-9]+-", par_passage: 100, max: 80}
