    nom: Parfum femme
    emoji: "🌸"
    mots_cles: [parfum + femme, eau de parfum + femme, coffret + parfum + femme, Chanel + parfum, Dior + parfum, Lancome, Yves Saint Laurent + parfum, Guerlain, Mugler, Armani + femme, Narciso Rodriguez, Paco Rabanne + femme]
  - id: parfum_homme
    nom: Parfum homme
    emoji: "🧴"
    mots_cles: [parfum + homme, eau de toilette + homme, eau de parfum + homme, Bleu de Chanel, Sauvage, Le Male, Azzaro, Hugo Boss + parfum, Paco Rabanne + homme, Armani + homme, Stronger With You]
