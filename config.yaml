# ============================================================================
#  SOURCE 5 : comptes X (Twitter) de bons plans, via l'API officielle de X
#  Il faut une clé d'API X (secret GitHub X_BEARER_TOKEN, voir README).
#  Sans clé, cette source est simplement ignorée.
#  - pour : profils à qui attribuer d'office les posts (sinon : profils trouvés
#    par mots-clés, ou « Tout le monde »)
# ============================================================================
reseaux:
  x:
    actif: true
    toutes_les_heures: 1            # 1 appel par compte et par heure (seuls les nouveaux posts sont lus)
    garder_jours: 4                 # durée d'affichage d'un post
    comptes:
      - {pseudo: Caminotv, pour: []}

# ============================================================================
#  SOURCE 4 : tes produits précis à surveiller
#  Le plus simple : bouton « Suivre le prix » / « Suivre un produit » sur la page
#  (crée une demande GitHub que le bot lit ; la fermer arrête le suivi).
#  Tu peux aussi les lister ici :
#  - url : une fiche LeDénicheur (recommandé : tous les marchands + historique)
#          ou la fiche du site marchand (marche si le site l'autorise, ex.
#          Clarins, Caudalie, Kiko, Typology, Etam, Lookfantastic, Rituals…)
#  - prix_cible : alerte dès que le prix passe dessous (facultatif)
#  - pour : profils concernés
# ============================================================================
surveillance: []
  # Exemple (enlève les # et remplace les [] ci-dessus par la liste) :
  # - nom: "Dyson Airwrap"
  #   url: "https://ledenicheur.fr/product.php?p=XXXXXXX"
  #   prix_cible: 400
  #   pour: [Sœurs]
