name: Découvrir des enseignes

# À lancer à la main (onglet Actions → « Découvrir des enseignes » → Run workflow)
# après avoir ajouté des sites dans outils/enseignes.yaml.
on:
  workflow_dispatch:
    inputs:
      tout:
        description: "Retester toute la liste (sinon : seulement les nouveaux sites)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: radar-cadeaux
  cancel-in-progress: false

jobs:
  decouvrir:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Tester les enseignes
        run: |
          if [ "${{ inputs.tout }}" = "true" ]; then python outils/decouvrir_enseignes.py; else python outils/decouvrir_enseignes.py --nouveaux; fi

      - name: Enregistrer
        run: |
          git config user.name "radar-cadeaux"
          git config user.email "radar-cadeaux@users.noreply.github.com"
          git add data/enseignes.yaml
          git diff --staged --quiet || git commit -m "enseignes découvertes $(date -u +%Y-%m-%d)" -q
          git pull --rebase -q -X theirs || true
          git push -q
